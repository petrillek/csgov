id: csgov_migrate_paragraph_component_guide_gallery
label: 'Paragraph - Gallery - Component Guide'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_editor_guide
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/paragraph_component_guide_gallery.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: created
      selector: created
    - name: field_csgov_p_title
      selector: field_csgov_p_title
    - name: field_csgov_p_media
      selector: field_csgov_p_media

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_gallery

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created

  field_csgov_p_title: field_csgov_p_title
  field_csgov_p_media: field_csgov_p_media

id: csgov_migrate_paragraph_csgov_tiles
label: Paragraph - Tiles
migration_group: csgov_guides
migration_tags:
- csgov_guides
- csgov_migrate
- csgov_migrate_paragraph
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: profiles/contrib/csgov/modules/csgov_guides/data/paragraph_csgov_tiles.json
  item_selector: ''
  ids:
    uuid:
      type: string
  fields:
  - name: uuid
    selector: uuid
  - name: langcode
    selector: langcode
  - name: status
    selector: status
  - name: created
    selector: created
  - name: field_csgov_p_title
    selector: field_csgov_p_title
  - name: field_csgov_p_content
    selector: field_csgov_p_content
  - name: field_csgov_p_background
    selector: field_csgov_p_background
  - name: field_csgov_p_tile_items
    selector: field_csgov_p_tile_items
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_tiles
process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created
  field_csgov_p_title: field_csgov_p_title
  field_csgov_p_content/value: field_csgov_p_content
  field_csgov_p_content/format:
    plugin: default_value
    default_value: basic_html
  field_csgov_p_background: field_csgov_p_background
  field_csgov_p_tile_items:
  - plugin: callback
    source: field_csgov_p_tile_items
    callable: csgov_migrate_process_multiple
  - plugin: sub_process
    process:
    - plugin: migration_lookup
      source: value
      migration: csgov_migrate_paragraph_csgov_tile_item
      no_stub: true
  - plugin: callback
    callable: csgov_migrate_process_reference
migration_dependencies:
  required:
  - csgov_migrate_paragraph_csgov_tile_item

id: csgov_migrate_paragraph_notification_guide_accordion_items
label: 'Paragraph - Accordion Items - Notification Guide'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_editor_guide

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/paragraph_notification_guide_accordion_items.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: field_csgov_p_accordion_item_title
      selector: field_csgov_p_accordion_item_title
    - name: field_csgov_p_accordion_item_text
      selector: field_csgov_p_accordion_item_text

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_accordion_item

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status

  field_csgov_p_accordion_item_title: field_csgov_p_accordion_item_title

  field_csgov_p_accordion_item_text/value: field_csgov_p_accordion_item_text
  field_csgov_p_accordion_item_text/format:
    plugin: default_value
    default_value: basic_html

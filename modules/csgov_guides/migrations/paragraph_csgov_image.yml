id: csgov_migrate_paragraph_csgov_image
label: Paragraph - Image
migration_group: csgov_guides
migration_tags:
- csgov_guides
- csgov_migrate
- csgov_migrate_paragraph
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: profiles/contrib/csgov/modules/csgov_guides/data/paragraph_csgov_image.json
  item_selector: ''
  ids:
    uuid:
      type: string
  fields:
  - name: uuid
    selector: uuid
  - name: langcode
    selector: langcode
  - name: status
    selector: status
  - name: created
    selector: created
  - name: field_csgov_p_image
    selector: field_csgov_p_image
  - name: field_csgov_p_caption
    selector: field_csgov_p_caption
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_image
process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created
  field_csgov_p_image:
  - plugin: default_value
    source: field_csgov_p_image
    default_value: -1
  - plugin: migration_lookup
    migration: csgov_migrate_media_csgov_image
    no_stub: true
  - plugin: csgov_migrate_media_override
    override: random_image
  field_csgov_p_caption/value: field_csgov_p_caption
  field_csgov_p_caption/format:
    plugin: default_value
    default_value: basic_html
migration_dependencies:
  required:
  - csgov_migrate_media_csgov_image

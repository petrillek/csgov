id: csgov_migrate_node_event_guide_overview
label: 'Node - Event Guide Overview'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide
migration_dependencies:
  required:
    - csgov_migrate_node_event_guide_steps

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/node_event_guide_overview.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_guide_items
      selector: field_csgov_guide_items

destination:
  plugin: entity:node
  default_bundle: csgov_guide_overview

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  uid:
    plugin: default_value
    default_value: 0
  title: title
  created: created
  changed: changed

  field_csgov_teaser: field_csgov_teaser

  field_csgov_guide_items:
    - plugin: callback
      source: field_csgov_guide_items
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        target_id:
          - plugin: migration_lookup
            source: value
            migration:
              - csgov_migrate_node_event_guide_steps
            no_stub: true

id: csgov_migrate_paragraph_shared_guides_images
label: Paragraph - Image - Shared Guides
migration_group: csgov_guides
migration_tags:
- csgov_guides
- csgov_migrate
- csgov_migrate_paragraph
- csgov_migrate_editor_guide
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: profiles/contrib/csgov/modules/csgov_guides/data/paragraph_shared_guides_images.json
  item_selector: ''
  ids:
    uuid:
      type: string
  fields:
  - name: uuid
    selector: uuid
  - name: langcode
    selector: langcode
  - name: status
    selector: status
  - name: created
    selector: created
  - name: field_csgov_p_image
    selector: field_csgov_p_image
  - name: field_csgov_p_image_caption
    selector: field_csgov_p_image_caption
  - name: field_csgov_p_full_width
    selector: field_csgov_p_full_width
  - name: field_csgov_p_view_mode
    selector: field_csgov_p_view_mode
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_image
process:
  uuid: uuid
  langcode: langcode
  status: status
  created: created
  field_csgov_p_image:
  - plugin: default_value
    source: field_csgov_p_image
    default_value: -1
  - plugin: migration_lookup
    migration: csgov_migrate_media_csgov_image
    no_stub: true
  - plugin: csgov_migrate_media_override
    override: random_image
  field_csgov_p_image_caption: field_csgov_p_image_caption
  field_csgov_p_full_width: field_csgov_p_full_width
  field_csgov_p_view_mode: field_csgov_p_view_mode

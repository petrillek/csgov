id: csgov_migrate_paragraph_gallery_guide_accordion
label: 'Paragraph - Accordion - Gallery Guide'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_editor_guide

migration_dependencies:
  required:
    - csgov_migrate_paragraph_gallery_guide_accordion_items

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/paragraph_gallery_guide_accordion.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: field_csgov_p_accordion_title
      selector: field_csgov_p_accordion_title
    - name: field_csgov_p_accordion_items
      selector: field_csgov_p_accordion_items

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_accordion

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status

  field_csgov_p_accordion_title: field_csgov_p_accordion_title

  field_csgov_p_accordion_items:
    - plugin: callback
      source: field_csgov_p_accordion_items
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration: csgov_migrate_paragraph_gallery_guide_accordion_items
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

id: csgov_migrate_node_scheduling_guide_overview
label: 'Node - Scheduling Guide - Overview'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide

migration_dependencies:
  required:
    - csgov_migrate_node_scheduling_guide_steps

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/node_scheduling_guide_overview.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_sbs_items
      selector: field_csgov_sbs_items

destination:
  plugin: entity:node
  default_bundle: csgov_step_by_step_overview

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  title: title
  created: created
  changed: changed

  field_csgov_teaser/value: field_csgov_teaser
  field_csgov_teaser/format:
    plugin: default_value
    default_value: basic_html

  field_csgov_sbs_items:
    - plugin: callback
      source: field_csgov_sbs_items
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration: csgov_migrate_node_scheduling_guide_steps
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

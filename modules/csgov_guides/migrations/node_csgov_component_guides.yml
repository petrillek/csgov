id: csgov_migrate_node_csgov_component_guides
label: 'Node - Component Guides (Step by Step)'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide
migration_dependencies:
  required:
    - csgov_migrate_paragraph_csgov_component_guides

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/node_csgov_component_guides.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: field_csgov_guide_parent
      selector: field_csgov_guide_parent
    - name: field_csgov_guide_step_label
      selector: field_csgov_guide_step_label
    - name: field_csgov_guide_annotation
      selector: field_csgov_guide_annotation
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_content_components
      selector: field_csgov_content_components

destination:
  plugin: entity:node
  default_bundle: csgov_guide

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  uid:
    plugin: default_value
    default_value: 0
  title: title
  created: created
  changed: changed

  field_csgov_guide_parent: field_csgov_guide_parent

  field_csgov_guide_step_label: field_csgov_guide_step_label
  field_csgov_guide_annotation: field_csgov_guide_annotation

  field_csgov_teaser: field_csgov_teaser

  field_csgov_content_components:
    - plugin: callback
      source: field_csgov_content_components
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration:
            - csgov_migrate_paragraph_csgov_component_guides
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

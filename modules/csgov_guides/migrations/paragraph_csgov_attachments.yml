id: csgov_migrate_paragraph_csgov_attachments
label: Paragraph - Attachments
migration_group: csgov_guides
migration_tags:
- csgov_guides
- csgov_migrate
- csgov_migrate_paragraph
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: profiles/contrib/csgov/modules/csgov_guides/data/paragraph_csgov_attachments.json
  item_selector: ''
  ids:
    uuid:
      type: string
  fields:
  - name: uuid
    selector: uuid
  - name: langcode
    selector: langcode
  - name: status
    selector: status
  - name: created
    selector: created
  - name: field_csgov_p_title
    selector: field_csgov_p_title
  - name: field_csgov_p_content
    selector: field_csgov_p_content
  - name: field_csgov_p_background
    selector: field_csgov_p_background
  - name: field_csgov_p_files
    selector: field_csgov_p_files
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_attachments
process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created
  field_csgov_p_title: field_csgov_p_title
  field_csgov_p_content/value: field_csgov_p_content
  field_csgov_p_content/format:
    plugin: default_value
    default_value: basic_html
  field_csgov_p_background: field_csgov_p_background
  field_csgov_p_files:
  - plugin: default_value
    source: field_csgov_p_files
    default_value: -1
  - plugin: migration_lookup
    migration: csgov_migrate_media_csgov_document
    no_stub: true
  - plugin: csgov_migrate_media_override
    override: random_image
migration_dependencies:
  required:
  - csgov_migrate_media_csgov_document

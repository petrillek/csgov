id: csgov_migrate_node_landing_page_guide_steps
label: 'Node - Landing Page Guide - Steps'
migration_group: csgov_migrate
migration_tags:
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide

migration_dependencies:
  required:
    - csgov_migrate_paragraph_landing_page_guide_content
    - csgov_migrate_paragraph_landing_page_guide_images
    - csgov_migrate_paragraph_landing_page_guide_infopanel
    - csgov_migrate_paragraph_landing_page_guide_accordion

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_docs/data/node_landing_page_guide_steps.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: field_csgov_sbs_parent
      selector: field_csgov_sbs_parent
    - name: field_csgov_sbs_step_label
      selector: field_csgov_sbs_step_label
    - name: field_csgov_sbs_annotation
      selector: field_csgov_sbs_annotation
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_content_components
      selector: field_csgov_content_components

destination:
  plugin: entity:node
  default_bundle: csgov_step_by_step

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  title: title
  created: created
  changed: changed

  field_csgov_sbs_parent:
    - plugin: csgov_migrate_process_reference
      source: field_csgov_sbs_parent
      entity_type: node
      value_key: uuid

  field_csgov_sbs_step_label: field_csgov_sbs_step_label

  field_csgov_sbs_annotation: field_csgov_sbs_annotation

  field_csgov_teaser/value: field_csgov_teaser
  field_csgov_teaser/format:
    plugin: default_value
    default_value: basic_html

  field_csgov_content_components:
    - plugin: explode
      source: field_csgov_content_components
      delimiter: ', '
    - plugin: csgov_migrate_process_reference
      entity_type: paragraph
      value_key: uuid

id: csgov_migrate_node_csgov_component_guides
label: 'Node - Component Guides (Step by Step)'
migration_group: csgov_migrate
migration_tags:
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide
migration_dependencies:
  required:
    - csgov_migrate_paragraph_csgov_component_guides
    - csgov_migrate_paragraph_text_examples
    - csgov_migrate_paragraph_infopanel_examples
    - csgov_migrate_paragraph_accordion_example
    - csgov_migrate_paragraph_image_examples
    - csgov_migrate_paragraph_gallery_examples
    - csgov_migrate_paragraph_node_list_examples
    - csgov_migrate_paragraph_image_text_examples
    - csgov_migrate_paragraph_tiles_examples
    - csgov_migrate_paragraph_attachments_examples

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_docs/data/node_csgov_component_guides.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: field_csgov_sbs_parent
      selector: field_csgov_sbs_parent
    - name: field_csgov_sbs_step_label
      selector: field_csgov_sbs_step_label
    - name: field_csgov_sbs_annotation
      selector: field_csgov_sbs_annotation
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_content_components
      selector: field_csgov_content_components

destination:
  plugin: entity:node
  default_bundle: csgov_step_by_step

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  uid:
    plugin: default_value
    default_value: 0
  title: title
  created: created
  changed: changed

  field_csgov_sbs_parent: field_csgov_sbs_parent

  field_csgov_sbs_step_label: field_csgov_sbs_step_label
  field_csgov_sbs_annotation: field_csgov_sbs_annotation

  field_csgov_teaser: field_csgov_teaser

  field_csgov_content_components:
    - plugin: callback
      source: field_csgov_content_components
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration:
            - csgov_migrate_paragraph_csgov_component_guides
            - csgov_migrate_paragraph_text_examples
            - csgov_migrate_paragraph_infopanel_examples
            - csgov_migrate_paragraph_accordion_example
            - csgov_migrate_paragraph_image_examples
            - csgov_migrate_paragraph_gallery_examples
            - csgov_migrate_paragraph_node_list_examples
            - csgov_migrate_paragraph_image_text_examples
            - csgov_migrate_paragraph_tiles_examples
            - csgov_migrate_paragraph_attachments_examples
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

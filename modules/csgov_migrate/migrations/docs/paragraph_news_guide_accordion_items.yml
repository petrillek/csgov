id: csgov_migrate_docs_paragraph_news_guide_accordion_items
label: 'Docs - News Guide Accordion Item Paragraphs'
migration_group: csgov_migrate
migration_tags:
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_docs

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_migrate/data/docs/paragraph_news_guide_accordion_items.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: created
      selector: created
    - name: field_csgov_p_title
      selector: field_csgov_p_title
    - name: field_csgov_p_content
      selector: field_csgov_p_content
    - name: field_csgov_p_icon
      selector: field_csgov_p_icon
    - name: field_csgov_p_is_open
      selector: field_csgov_p_is_open

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_accordion_item

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created

  field_csgov_p_title: field_csgov_p_title

  field_csgov_p_content/value: field_csgov_p_content
  field_csgov_p_content/format:
    plugin: default_value
    default_value: basic_html

  field_csgov_p_icon:
    - plugin: skip_on_empty
      source: field_csgov_p_icon
      method: process
    - plugin: migration_lookup
      migration: csgov_migrate_media_svg
      no_stub: true

  field_csgov_p_is_open: field_csgov_p_is_open
